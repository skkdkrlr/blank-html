<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>IRON FURY - Shadow Ops</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, sans-serif; user-select: none; touch-action: none; }
        #blocker {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: white;
            flex-direction: column;
            cursor: pointer;
        }
        #blocker h1 { font-size: 3em; margin: 0; text-shadow: 0 0 20px #ffaa00; }
        #blocker p { font-size: 1.2em; opacity: 0.8; }
        #hud {
            position: fixed;
            bottom: 30px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: none;
            z-index: 10;
            color: white;
            text-shadow: 0 0 10px black;
            font-size: 1.2rem;
        }
        #health-bar {
            width: 200px; height: 12px;
            background: #333;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #888;
        }
        #health-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ff0040, #ff6600);
            transition: width 0.1s;
        }
        #ammo { font-size: 1.8rem; font-weight: bold; letter-spacing: 2px; }
        #score { font-size: 1.4rem; background: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 20px; }
        #enemy-count { font-size: 1.2rem; background: rgba(0,0,0,0.5); padding: 5px 12px; border-radius: 20px; margin-left: 10px; }
        #crosshair {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255,255,255,0.8);
            font-size: 2rem;
            pointer-events: none;
            z-index: 20;
            text-shadow: 0 0 5px black;
        }
        #controls-mobile {
            position: fixed;
            bottom: 20px;
            left: 0; right: 0;
            display: none;
            justify-content: space-between;
            padding: 0 15px;
            pointer-events: none;
            z-index: 30;
        }
        .touch-btn {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: rgba(255,255,255,0.25);
            backdrop-filter: blur(4px);
            border: 2px solid rgba(255,255,255,0.5);
            color: white;
            font-size: 1.8rem;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            touch-action: none;
            user-select: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .touch-btn:active { background: rgba(255,255,255,0.4); transform: scale(0.92); }
        #btn-fire { width: 80px; height: 80px; background: rgba(255,50,50,0.5); border-color: #ff6666; font-size: 1.2rem; }
        #btn-jump { width: 60px; height: 60px; background: rgba(50,200,255,0.3); border-color: #66ccff; }
        #btn-sprint { width: 60px; height: 60px; background: rgba(255,200,50,0.3); border-color: #ffcc66; font-size: 1rem; }

        @media (max-width: 800px) {
            #controls-mobile { display: flex; }
            #hud { font-size: 0.9rem; bottom: 100px; }
            #health-bar { width: 120px; }
        }
        @media (pointer: coarse) {
            #controls-mobile { display: flex; }
        }
        #info {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #aaa;
            font-size: 0.8rem;
            background: rgba(0,0,0,0.6);
            padding: 5px 15px;
            border-radius: 20px;
            z-index: 5;
            pointer-events: none;
            white-space: nowrap;
        }
        #reload-indicator {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffaa00;
            font-size: 1.2rem;
            background: rgba(0,0,0,0.7);
            padding: 5px 20px;
            border-radius: 30px;
            display: none;
            z-index: 25;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="blocker">
        <h1>⚔ IRON FURY</h1>
        <p>برای شروع کلیک کنید • WASD حرکت • Shift دویدن • Space پرش • کلیک چپ تیراندازی • R خشاب</p>
        <p style="font-size:0.9rem; opacity:0.6;">روی موبایل با دکمه‌های مجازی</p>
    </div>

    <div id="crosshair">✚</div>
    <div id="info">🔫 SHADOW OPS • نسخه‌ی قابل اجرا</div>
    <div id="reload-indicator">⏳ در حال تعویض خشاب...</div>

    <div id="hud">
        <div>
            <div style="display:flex; align-items:center; gap:10px;">
                <span>❤️</span>
                <div id="health-bar"><div id="health-fill"></div></div>
                <span id="health-text">100</span>
            </div>
            <div style="margin-top:5px; display:flex; gap:10px;">
                <span id="score">🎯 0</span>
                <span id="enemy-count">👾 10</span>
            </div>
        </div>
        <div id="ammo">30 / 30</div>
    </div>

    <div id="controls-mobile">
        <div style="display:flex; gap:10px;">
            <div class="touch-btn" id="btn-sprint">🏃</div>
            <div class="touch-btn" id="btn-jump">⬆</div>
        </div>
        <div class="touch-btn" id="btn-fire">🔥</div>
    </div>

    <!-- Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.152.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.152.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // --- تنظیمات اولیه ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111a2b);
        scene.fog = new THREE.Fog(0x111a2b, 20, 60);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.7, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.prepend(renderer.domElement);

        // --- کنترل‌ها ---
        const controls = new PointerLockControls(camera, document.body);
        const blocker = document.getElementById('blocker');
        blocker.addEventListener('click', () => controls.lock());

        // --- نورپردازی سینمایی ---
        const ambient = new THREE.AmbientLight(0x404060);
        scene.add(ambient);
        const dirLight = new THREE.DirectionalLight(0xffeedd, 1.5);
        dirLight.position.set(10, 20, 5);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);
        const fillLight = new THREE.DirectionalLight(0x4488ff, 0.4);
        fillLight.position.set(-10, 5, -10);
        scene.add(fillLight);
        const hemi = new THREE.HemisphereLight(0x4466ff, 0x223322, 0.6);
        scene.add(hemi);

        // --- زمین و محیط ---
        const groundGeo = new THREE.PlaneGeometry(80, 80);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x2a3a4a, roughness: 0.9, metalness: 0.1 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // دیوارهای ساده برای محیط
        function addWall(x, z, w, h, color = 0x3a4a5a) {
            const geo = new THREE.BoxGeometry(w, h, 0.5);
            const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.7 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, h/2, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
            return mesh;
        }
        addWall(-10, -8, 15, 2, 0x4a5a6a);
        addWall(12, -5, 10, 2.5, 0x5a4a3a);
        addWall(-5, 10, 12, 2, 0x3a5a4a);
        addWall(8, 8, 8, 3, 0x6a5a4a);
        // چند جعبه برای کاور
        function createBox(x, z, w, h, d, color = 0x6a7a8a) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.6 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, h/2, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
            return mesh;
        }
        createBox(3, -2, 1.5, 1, 1.5, 0x8a7a6a);
        createBox(-4, 4, 2, 1.2, 1.2, 0x6a8a7a);
        createBox(6, -6, 1.8, 0.8, 1.8, 0x7a6a5a);

        // --- متغیرهای بازیکن ---
        const player = {
            height: 1.7,
            speed: 5,
            sprintMultiplier: 1.8,
            jumpPower: 5,
            gravity: -15,
            velocity: new THREE.Vector3(0, 0, 0),
            onGround: false,
            health: 100,
            maxHealth: 100,
            score: 0,
            ammo: 30,
            maxAmmo: 30,
            isReloading: false,
            reloadTime: 2.0,
            isLocked: false
        };

        // --- دشمنان ---
        const enemies = [];
        const enemyCount = 10;
        const enemySpeed = 2.5;
        const attackDistance = 2.0;
        const attackCooldown = 1.0;
        let enemyAttackTimers = [];

        function spawnEnemy() {
            let x, z, valid;
            let attempts = 0;
            do {
                x = (Math.random() - 0.5) * 50;
                z = (Math.random() - 0.5) * 50;
                valid = Math.sqrt(x*x + z*z) > 5 && Math.sqrt(x*x + z*z) < 30;
                attempts++;
            } while (!valid && attempts < 50);
            
            const geo = new THREE.SphereGeometry(0.5, 8, 8);
            const mat = new THREE.MeshStandardMaterial({ color: 0xff3333, emissive: 0x440000, roughness: 0.3 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, 0.5, z);
            mesh.castShadow = true;
            scene.add(mesh);
            
            // یک نشانگر ساده برای جهت
            const eye = new THREE.Mesh(
                new THREE.SphereGeometry(0.15, 6, 6),
                new THREE.MeshStandardMaterial({ color: 0xffff00, emissive: 0x442200 })
            );
            eye.position.set(0, 0.2, 0.4);
            mesh.add(eye);
            
            enemies.push({
                mesh: mesh,
                health: 50,
                state: 'idle', // idle, chase, attack
                attackTimer: 0,
                speed: enemySpeed + Math.random() * 0.5,
                damage: 10
            });
            enemyAttackTimers.push(0);
        }

        for (let i=0; i<enemyCount; i++) spawnEnemy();

        // --- سیستم گلوله (Raycaster) ---
        const raycaster = new THREE.Raycaster();
        const bulletImpact = new THREE.Mesh(
            new THREE.SphereGeometry(0.08, 4, 4),
            new THREE.MeshBasicMaterial({ color: 0xffaa00 })
        );
        bulletImpact.visible = false;
        scene.add(bulletImpact);

        function shoot() {
            if (player.isReloading) return;
            if (player.ammo <= 0) {
                startReload();
                return;
            }
            player.ammo--;
            updateHUD();

            // صدا و افکت (ساده)
            raycaster.setFromCamera({ x: 0, y: 0 }, camera);
            const intersects = raycaster.intersectObjects(scene.children, true);
            let hitEnemy = false;
            for (let obj of intersects) {
                if (obj.distance > 50) break;
                // بررسی برخورد با دشمنان
                let enemyIndex = -1;
                for (let i=0; i<enemies.length; i++) {
                    if (enemies[i].mesh === obj.object || obj.object.parent === enemies[i].mesh) {
                        enemyIndex = i;
                        break;
                    }
                }
                if (enemyIndex !== -1) {
                    const enemy = enemies[enemyIndex];
                    enemy.health -= 25;
                    if (enemy.health <= 0) {
                        // نابودی دشمن
                        scene.remove(enemy.mesh);
                        enemies.splice(enemyIndex, 1);
                        player.score += 10;
                        updateHUD();
                        // افکت انفجار (ذرات)
                        createExplosion(enemy.mesh.position.clone());
                        // دشمن جدید تولید کن (برای حفظ تعداد)
                        if (enemies.length < 20) spawnEnemy();
                    }
                    hitEnemy = true;
                    break;
                } else if (obj.object !== ground && obj.object !== bulletImpact) {
                    // برخورد به دیوار
                    bulletImpact.position.copy(obj.point);
                    bulletImpact.visible = true;
                    setTimeout(() => bulletImpact.visible = false, 150);
                    break;
                }
            }
            if (!hitEnemy) {
                // شلیک به هوا
                bulletImpact.position.set(0, -10, 0);
                bulletImpact.visible = false;
            }
        }

        function createExplosion(position) {
            const count = 30;
            const particles = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);
            for (let i=0; i<count; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.random() * Math.PI;
                const r = 0.5 + Math.random() * 1.5;
                positions[i*3] = Math.sin(phi) * Math.cos(theta) * r;
                positions[i*3+1] = Math.sin(phi) * Math.sin(theta) * r;
                positions[i*3+2] = Math.cos(phi) * r;
                colors[i*3] = 1;
                colors[i*3+1] = 0.5 + Math.random() * 0.5;
                colors[i*3+2] = 0;
            }
            particles.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            particles.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            const mat = new THREE.PointsMaterial({ size: 0.2, vertexColors: true, blending: THREE.AdditiveBlending });
            const points = new THREE.Points(particles, mat);
            points.position.copy(position);
            scene.add(points);
            setTimeout(() => scene.remove(points), 600);
        }

        // --- سیستم خشاب ---
        function startReload() {
            if (player.isReloading || player.ammo === player.maxAmmo) return;
            player.isReloading = true;
            document.getElementById('reload-indicator').style.display = 'block';
            setTimeout(() => {
                player.ammo = player.maxAmmo;
                player.isReloading = false;
                document.getElementById('reload-indicator').style.display = 'none';
                updateHUD();
            }, player.reloadTime * 1000);
        }

        // --- HUD ---
        function updateHUD() {
            const healthPercent = (player.health / player.maxHealth) * 100;
            document.getElementById('health-fill').style.width = Math.max(0, healthPercent) + '%';
            document.getElementById('health-text').textContent = Math.round(player.health);
            document.getElementById('ammo').textContent = player.ammo + ' / ' + player.maxAmmo;
            document.getElementById('score').textContent = '🎯 ' + player.score;
            document.getElementById('enemy-count').textContent = '👾 ' + enemies.length;
        }
        updateHUD();

        // --- حرکت و فیزیک ---
        const keys = { w: false, a: false, s: false, d: false, shift: false, space: false };
        document.addEventListener('keydown', (e) => {
            switch(e.code) {
                case 'KeyW': keys.w = true; e.preventDefault(); break;
                case 'KeyA': keys.a = true; e.preventDefault(); break;
                case 'KeyS': keys.s = true; e.preventDefault(); break;
                case 'KeyD': keys.d = true; e.preventDefault(); break;
                case 'ShiftLeft': keys.shift = true; e.preventDefault(); break;
                case 'Space': keys.space = true; e.preventDefault(); break;
                case 'KeyR': startReload(); e.preventDefault(); break;
            }
        });
        document.addEventListener('keyup', (e) => {
            switch(e.code) {
                case 'KeyW': keys.w = false; e.preventDefault(); break;
                case 'KeyA': keys.a = false; e.preventDefault(); break;
                case 'KeyS': keys.s = false; e.preventDefault(); break;
                case 'KeyD': keys.d = false; e.preventDefault(); break;
                case 'ShiftLeft': keys.shift = false; e.preventDefault(); break;
                case 'Space': keys.space = false; e.preventDefault(); break;
            }
        });

        // کلیک برای تیراندازی
        renderer.domElement.addEventListener('click', () => {
            if (controls.isLocked) shoot();
        });
        // دکمه‌های لمسی
        document.getElementById('btn-fire').addEventListener('touchstart', (e) => { e.preventDefault(); if (controls.isLocked) shoot(); });
        document.getElementById('btn-jump').addEventListener('touchstart', (e) => { e.preventDefault(); keys.space = true; });
        document.getElementById('btn-jump').addEventListener('touchend', (e) => { e.preventDefault(); keys.space = false; });
        document.getElementById('btn-sprint').addEventListener('touchstart', (e) => { e.preventDefault(); keys.shift = true; });
        document.getElementById('btn-sprint').addEventListener('touchend', (e) => { e.preventDefault(); keys.shift = false; });

        // --- حلقه‌ی اصلی بازی ---
        const clock = new THREE.Clock();

        function animate() {
            const delta = Math.min(clock.getDelta(), 0.05);
            const time = clock.elapsedTime;

            // --- حرکت بازیکن ---
            if (controls.isLocked) {
                player.isLocked = true;
                const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                forward.y = 0;
                forward.normalize();
                const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
                right.y = 0;
                right.normalize();

                let moveX = 0, moveZ = 0;
                if (keys.w) moveZ -= 1;
                if (keys.s) moveZ += 1;
                if (keys.a) moveX -= 1;
                if (keys.d) moveX += 1;
                const moveDir = new THREE.Vector3();
                moveDir.addScaledVector(forward, moveZ);
                moveDir.addScaledVector(right, moveX);
                if (moveDir.length() > 0) {
                    moveDir.normalize();
                    const speed = keys.shift ? player.speed * player.sprintMultiplier : player.speed;
                    player.velocity.x = moveDir.x * speed;
