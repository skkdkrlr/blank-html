<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>THE WORLD I MADE FOR YOU</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }

        /* overlay layers */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #overlay.active {
            pointer-events: auto;
        }

        #boot-text {
            color: #aabbcc;
            font-size: clamp(14px, 3.2vw, 28px);
            font-weight: 300;
            letter-spacing: 6px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.8s ease;
            text-shadow: 0 0 30px rgba(100, 180, 255, 0.08);
            background: rgba(0, 0, 0, 0.4);
            padding: 20px 40px;
            border-radius: 4px;
            backdrop-filter: blur(2px);
        }
        #boot-text.show {
            opacity: 1;
        }

        #message-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            opacity: 0;
            transition: opacity 1.5s ease;
        }
        #message-layer.show {
            opacity: 1;
            pointer-events: auto;
        }

        #final-msg {
            color: #fff;
            font-size: clamp(22px, 5.5vw, 52px);
            font-weight: 200;
            letter-spacing: 3px;
            text-align: center;
            line-height: 1.6;
            padding: 0 20px;
            text-shadow: 0 0 60px rgba(255, 200, 200, 0.15);
            max-width: 90%;
        }
        #final-msg .highlight {
            font-weight: 400;
            color: #ff9a9e;
            text-shadow: 0 0 80px rgba(255, 150, 150, 0.3);
        }
        #final-msg .sub {
            font-size: clamp(12px, 2.5vw, 22px);
            opacity: 0.6;
            margin-top: 12px;
            letter-spacing: 8px;
            font-weight: 200;
        }

        #reveal-btn {
            margin-top: 30px;
            padding: 14px 44px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50px;
            color: #ddd;
            font-size: clamp(12px, 2vw, 16px);
            letter-spacing: 4px;
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.6s ease;
            backdrop-filter: blur(12px);
            background: rgba(255, 255, 255, 0.02);
            font-weight: 300;
        }
        #reveal-btn:hover,
        #reveal-btn:active {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.3);
            transform: scale(1.02);
            box-shadow: 0 0 60px rgba(255, 200, 200, 0.05);
        }

        #final-reveal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 30;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            opacity: 0;
            transition: opacity 2.5s ease;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(6px);
        }
        #final-reveal.show {
            opacity: 1;
            pointer-events: auto;
        }
        #final-reveal .big {
            font-size: clamp(32px, 8vw, 72px);
            font-weight: 200;
            color: #fff;
            letter-spacing: 8px;
            text-shadow: 0 0 80px rgba(255, 200, 200, 0.12);
        }
        #final-reveal .big .accent {
            color: #ffb3b8;
            font-weight: 300;
            text-shadow: 0 0 100px rgba(255, 150, 150, 0.2);
        }
        #final-reveal .sub {
            font-size: clamp(14px, 3vw, 28px);
            color: rgba(255, 255, 255, 0.4);
            margin-top: 10px;
            letter-spacing: 10px;
            font-weight: 200;
        }

        #hud {
            position: fixed;
            bottom: 30px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 5;
            pointer-events: none;
            color: rgba(255, 255, 255, 0.06);
            font-size: 10px;
            letter-spacing: 6px;
            font-weight: 100;
            transition: opacity 0.8s ease;
        }

        /* loading screen */
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            transition: opacity 1.2s ease;
        }
        #loading.hide {
            opacity: 0;
            pointer-events: none;
        }
        #loading .spinner {
            width: 32px;
            height: 32px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-top-color: rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            animation: spin 1.4s cubic-bezier(0.25, 0.1, 0.25, 1) infinite;
        }
        #loading .label {
            color: rgba(255, 255, 255, 0.08);
            font-size: 10px;
            letter-spacing: 8px;
            margin-top: 18px;
            font-weight: 200;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 480px) {
            #boot-text {
                padding: 14px 24px;
                letter-spacing: 3px;
            }
            #final-msg {
                letter-spacing: 1px;
            }
            #reveal-btn {
                padding: 12px 30px;
            }
        }
    </style>
</head>
<body>

    <!-- Loading -->
    <div id="loading"><div class="spinner"></div><div class="label">INITIALIZING</div></div>

    <!-- Boot overlay -->
    <div id="overlay"><div id="boot-text"></div></div>

    <!-- HUD -->
    <div id="hud">✦</div>

    <!-- Message layer -->
    <div id="message-layer">
        <div id="final-msg"></div>
        <button id="reveal-btn">آخرین چیز رو ببین</button>
    </div>

    <!-- Final reveal -->
    <div id="final-reveal">
        <div class="big"><span class="accent">YOU ARE SPECIAL</span></div>
        <div class="sub">برای من</div>
    </div>

    <!-- Three.js will render here -->

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // IMPORTS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
        import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
        import { FXAAShader } from 'three/addons/shaders/FXAAShader.js';

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // DOM REFS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const overlay = document.getElementById('overlay');
        const bootText = document.getElementById('boot-text');
        const msgLayer = document.getElementById('message-layer');
        const finalMsg = document.getElementById('final-msg');
        const revealBtn = document.getElementById('reveal-btn');
        const finalReveal = document.getElementById('final-reveal');
        const loading = document.getElementById('loading');
        const hud = document.getElementById('hud');

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // SCENE SETUP
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x080c14);
        scene.fog = new THREE.FogExp2(0x080c14, 0.012);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 400);
        camera.position.set(18, 12, 28);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            powerPreference: "high-performance",
            alpha: false,
            stencil: false,
            depth: true
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        document.body.prepend(renderer.domElement);

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // POST PROCESSING
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const composer = new EffectComposer(renderer);
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);

        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            0.35, 0.4, 0.15
        );
        composer.addPass(bloomPass);

        const outputPass = new OutputPass();
        composer.addPass(outputPass);

        // FXAA
        const fxaaPass = new ShaderPass(FXAAShader);
        fxaaPass.uniforms['resolution'].value.set(
            1 / window.innerWidth,
            1 / window.innerHeight
        );
        composer.addPass(fxaaPass);

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // LIGHTS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const ambient = new THREE.AmbientLight(0x223355, 0.25);
        scene.add(ambient);

        const moonLight = new THREE.DirectionalLight(0x4466aa, 0.4);
        moonLight.position.set(-20, 30, 10);
        moonLight.castShadow = true;
        moonLight.shadow.mapSize.width = 1024;
        moonLight.shadow.mapSize.height = 1024;
        moonLight.shadow.camera.near = 0.1;
        moonLight.shadow.camera.far = 80;
        moonLight.shadow.camera.left = -40;
        moonLight.shadow.camera.right = 40;
        moonLight.shadow.camera.top = 40;
        moonLight.shadow.camera.bottom = -40;
        scene.add(moonLight);

        const rimLight = new THREE.DirectionalLight(0x88bbff, 0.15);
        rimLight.position.set(10, 5, -20);
        scene.add(rimLight);

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // CITY GENERATION
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const cityGroup = new THREE.Group();
        scene.add(cityGroup);

        const buildings = [];
        const buildingPositions = [];
        const GROUND_SIZE = 60;
        const BUILDING_MAX = 18;

        // Ground plane with wet reflection look
        const groundGeo = new THREE.PlaneGeometry(GROUND_SIZE, GROUND_SIZE, 1, 1);
        const groundMat = new THREE.MeshStandardMaterial({
            color: 0x0a0e1a,
            roughness: 0.25,
            metalness: 0.7,
            envMapIntensity: 0.6,
            emissive: new THREE.Color(0x111833),
            emissiveIntensity: 0.08,
        });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.05;
        ground.receiveShadow = true;
        cityGroup.add(ground);

        // Grid lines for road
        const gridHelper = new THREE.GridHelper(GROUND_SIZE, 40, 0x334466, 0x223355);
        gridHelper.position.y = 0.01;
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.15;
        cityGroup.add(gridHelper);

        // Building materials
        const matColors = [
            0x2a2a3a, 0x1a1a2e, 0x33334a, 0x222244, 0x3a3a4a,
            0x1e1e32, 0x282844, 0x2e2e42, 0x16162a, 0x3e3e52
        ];
        const windowColors = [
            0xffcc66, 0xffaa44, 0x88ccff, 0xff8844, 0x66aaff,
            0xffdd77, 0x99ddff, 0xff9966, 0x77bbff, 0xffbb55
        ];

        function createBuilding(x, z, w, d, h) {
            const color = matColors[Math.floor(Math.random() * matColors.length)];
            const mat = new THREE.MeshStandardMaterial({
                color: color,
                roughness: 0.6,
                metalness: 0.4,
                envMapIntensity: 0.3,
            });
            const geo = new THREE.BoxGeometry(w, h, d);
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, h / 2, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            cityGroup.add(mesh);

            // Windows (emissive strips)
            const winMat = new THREE.MeshStandardMaterial({
                color: windowColors[Math.floor(Math.random() * windowColors.length)],
                emissive: new THREE.Color(0xffaa44),
                emissiveIntensity: 0.15 + Math.random() * 0.25,
                roughness: 0.2,
                metalness: 0.1,
            });
            const winCount = Math.floor(Math.random() * 6) + 3;
            for (let i = 0; i < winCount; i++) {
                const wy = (i / winCount) * h + 0.5;
                const ww = w * 0.3;
                const wd = d * 0.3;
                const side = Math.floor(Math.random() * 4);
                let wx = x,
                    wz = z;
                if (side === 0) { wx = x - w / 2 - 0.05;
                    wz = z + (Math.random() - 0.5) * d * 0.5; } else if (side === 1) { wx = x + w / 2 + 0.05;
                    wz = z + (Math.random() - 0.5) * d * 0.5; } else if (side === 2) { wz = z - d / 2 - 0.05;
                    wx = x + (Math.random() - 0.5) * w * 0.5; } else { wz = z + d / 2 + 0.05;
                    wx = x + (Math.random() - 0.5) * w * 0.5; }
                const winGeo = new THREE.PlaneGeometry(ww * 0.5, wd * 0.4);
                const winMesh = new THREE.Mesh(winGeo, winMat);
                winMesh.position.set(wx, wy, wz);
                if (side === 0 || side === 1) winMesh.rotation.y = side === 0 ? Math.PI / 2 : -Math.PI / 2;
                else winMesh.rotation.y = side === 2 ? 0 : Math.PI;
                cityGroup.add(winMesh);
                // store for later animation
                winMesh.userData = { baseIntensity: winMat.emissiveIntensity, phase: Math.random() * 100 };
            }

            // roof light
            if (h > 6 && Math.random() > 0.5) {
                const roofMat = new THREE.MeshStandardMaterial({
                    color: 0xff4444,
                    emissive: 0xff2222,
                    emissiveIntensity: 0.1 + Math.random() * 0.2,
                    transparent: true,
                    opacity: 0.3,
                });
                const roofGeo = new THREE.BoxGeometry(w * 0.15, 0.1, d * 0.15);
                const roof = new THREE.Mesh(roofGeo, roofMat);
                roof.position.set(x, h + 0.05, z);
                cityGroup.add(roof);
            }

            return { mesh, width: w, depth: d, height: h, x, z };
        }

        // Generate buildings in a grid
        const spacing = 2.8;
        const half = Math.floor(GROUND_SIZE / 2 / spacing) - 1;
        for (let ix = -half; ix <= half; ix++) {
            for (let iz = -half; iz <= half; iz++) {
                const x = ix * spacing + (Math.random() - 0.5) * 0.6;
                const z = iz * spacing + (Math.random() - 0.5) * 0.6;
                if (Math.abs(x) < 4 && Math.abs(z) < 4) continue; // center plaza
                if (Math.random() > 0.55) continue;
                const h = 2 + Math.random() * BUILDING_MAX;
                const w = 0.8 + Math.random() * 1.6;
                const d = 0.8 + Math.random() * 1.6;
                const b = createBuilding(x, z, w, d, h);
                buildings.push(b);
                buildingPositions.push({ x, z });
            }
        }

        // Center plaza - special buildings
        for (let i = 0; i < 8; i++) {
            const angle = (i / 8) * Math.PI * 2;
            const r = 5 + Math.random() * 2;
            const x = Math.cos(angle) * r;
            const z = Math.sin(angle) * r;
            const h = 6 + Math.random() * 8;
            const w = 1.2 + Math.random() * 0.8;
            const d = 1.2 + Math.random() * 0.8;
            const b = createBuilding(x, z, w, d, h);
            buildings.push(b);
            buildingPositions.push({ x, z });
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // NEON SIGNS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const neonSigns = [];
        const neonColors = [0xff3366, 0x44ddff, 0xff66aa, 0x66ffcc, 0xffaa44, 0xaa88ff];

        for (let i = 0; i < 25; i++) {
            const idx = Math.floor(Math.random() * buildings.length);
            const b = buildings[idx];
            if (!b) continue;
            const color = neonColors[Math.floor(Math.random() * neonColors.length)];
            const mat = new THREE.MeshStandardMaterial({
                color: color,
                emissive: color,
                emissiveIntensity: 0.6 + Math.random() * 0.8,
                transparent: true,
                opacity: 0.7 + Math.random() * 0.3,
            });
            const w = 0.6 + Math.random() * 1.2;
            const h = 0.15 + Math.random() * 0.3;
            const geo = new THREE.BoxGeometry(w, h, 0.05);
            const sign = new THREE.Mesh(geo, mat);
            const side = Math.floor(Math.random() * 4);
            const yOff = 1 + Math.random() * (b.height * 0.6);
            if (side === 0) { sign.position.set(b.x - b.width / 2 - 0.1, yOff, b.z);
                sign.rotation.y = Math.PI / 2; } else if (side === 1) { sign.position.set(b.x + b.width / 2 + 0.1, yOff, b.z);
                sign.rotation.y = -Math.PI / 2; } else if (side === 2) { sign.position.set(b.x, yOff, b.z - b.depth / 2 - 0.1); }
            else { sign.position.set(b.x, yOff, b.z + b.depth / 2 + 0.1);
                sign.rotation.y = Math.PI; }
            cityGroup.add(sign);
            neonSigns.push({ mesh: sign, mat, phase: Math.random() * 100, speed: 0.5 + Math.random() * 0.5 });
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // STREET LAMPS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const lampMat = new THREE.MeshStandardMaterial({
            color: 0x444466,
            emissive: 0xffdd88,
            emissiveIntensity: 0.05,
            roughness: 0.5,
            metalness: 0.7,
        });
        for (let i = 0; i < 60; i++) {
            const angle = Math.random() * Math.PI * 2;
            const r = 4 + Math.random() * 26;
            const x = Math.cos(angle) * r;
            const z = Math.sin(angle) * r;
            const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 2.5, 4), lampMat);
            pole.position.set(x, 1.25, z);
            pole.castShadow = true;
            cityGroup.add(pole);
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.25, 6, 6), new THREE.MeshStandardMaterial({
                color: 0xffdd77,
                emissive: 0xffaa44,
                emissiveIntensity: 0.2,
                transparent: true,
                opacity: 0.6,
            }));
            head.position.set(x, 2.6, z);
            cityGroup.add(head);
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // RAIN SYSTEM
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const rainCount = 12000;
        const rainGeo = new THREE.BufferGeometry();
        const rainPos = new Float32Array(rainCount * 3);
        const rainVel = new Float32Array(rainCount);
        const rainArea = 50;
        for (let i = 0; i < rainCount; i++) {
            rainPos[i * 3] = (Math.random() - 0.5) * rainArea;
            rainPos[i * 3 + 1] = Math.random() * 30;
            rainPos[i * 3 + 2] = (Math.random() - 0.5) * rainArea;
            rainVel[i] = 8 + Math.random() * 6;
        }
        rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));

        const rainMat = new THREE.PointsMaterial({
            color: 0xaabbdd,
            size: 0.08,
            transparent: true,
            opacity: 0.5,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true,
        });
        const rainSystem = new THREE.Points(rainGeo, rainMat);
        rainSystem.position.y = 5;
        scene.add(rainSystem);

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // CARS (simple)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const cars = [];
        const carColors = [0xcc2233, 0x2244aa, 0x33aa66, 0xdd8822, 0x8844aa, 0xeeeeee, 0x222222];

        function createCar(x, z, angle) {
            const col = carColors[Math.floor(Math.random() * carColors.length)];
            const mat = new THREE.MeshStandardMaterial({
                color: col,
                roughness: 0.3,
                metalness: 0.6,
                envMapIntensity: 0.5,
            });
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.3, 0.6), mat);
            body.position.set(x, 0.2, z);
            body.rotation.y = angle;
            body.castShadow = true;
            cityGroup.add(body);
            const cab = new THREE.Mesh(
                new THREE.BoxGeometry(0.5, 0.25, 0.55),
                new THREE.MeshStandardMaterial({ color: 0x88ccff, roughness: 0.1, metalness: 0.2, transparent: true,
                    opacity: 0.5 })
            );
            cab.position.set(x + Math.sin(angle) * 0.2, 0.4, z + Math.cos(angle) * 0.2);
            cab.rotation.y = angle;
            cityGroup.add(cab);
            // headlights
            const hlMat = new THREE.MeshStandardMaterial({
                color: 0xffffaa,
                emissive: 0xffff88,
                emissiveIntensity: 0.3,
            });
            const hl = new THREE.Mesh(new THREE.SphereGeometry(0.08, 4, 4), hlMat);
            hl.position.set(x + Math.sin(angle) * 0.55, 0.2, z + Math.cos(angle) * 0.55);
            cityGroup.add(hl);
            return {
                body,
                cab,
                hl,
                x,
                z,
                angle,
                speed: 0.5 + Math.random() * 0.8,
                phase: Math.random() * 100,
                path: Math.floor(Math.random() * 4),
                active: true,
            };
        }

        for (let i = 0; i < 18; i++) {
            const angle = Math.random() * Math.PI * 2;
            const r = 4 + Math.random() * 22;
            const x = Math.cos(angle) * r;
            const z = Math.sin(angle) * r;
            const car = createCar(x, z, Math.random() * Math.PI * 2);
            cars.push(car);
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // NPCS (simple figures)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const npcs = [];
        const npcColors = [0x446688, 0x884466, 0x668844, 0x886644, 0x664488, 0x448866];

        function createNPC(x, z) {
            const col = npcColors[Math.floor(Math.random() * npcColors.length)];
            const mat = new THREE.MeshStandardMaterial({ color: col, roughness: 0.7, metalness: 0.1 });
            const group = new THREE.Group();
            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.25, 0.6, 6), mat);
            body.position.y = 0.3;
            body.castShadow = true;
            group.add(body);
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.12, 6, 6),
                new THREE.MeshStandardMaterial({ color: 0xddbb99, roughness: 0.6 })
            );
            head.position.y = 0.7;
            head.castShadow = true;
            group.add(head);
            group.position.set(x, 0, z);
            cityGroup.add(group);
            return {
                group,
                x,
                z,
                targetX: x,
                targetZ: z,
                speed: 0.2 + Math.random() * 0.3,
                phase: Math.random() * 100,
                state: 'idle',
                timer: 0,
                dir: Math.random() * Math.PI * 2,
            };
        }

        for (let i = 0; i < 30; i++) {
            const angle = Math.random() * Math.PI * 2;
            const r = 3 + Math.random() * 24;
            const x = Math.cos(angle) * r;
            const z = Math.sin(angle) * r;
            const npc = createNPC(x, z);
            npcs.push(npc);
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // BILLBOARD (special)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const billboardMat = new THREE.MeshStandardMaterial({
            color: 0x111122,
            emissive: 0x000000,
            emissiveIntensity: 0,
            roughness: 0.3,
            metalness: 0.1,
            side: THREE.DoubleSide,
        });
        const billboard = new THREE.Mesh(new THREE.PlaneGeometry(3.0, 1.2), billboardMat);
        billboard.position.set(12, 4.5, 8);
        billboard.rotation.y = -0.5;
        cityGroup.add(billboard);

        // billboard text overlay (using canvas texture)
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 256;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, 512, 256);
        ctx.fillStyle = '#88ccff';
        ctx.font = '48px "Helvetica Neue", Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('WE WERE WAITING', 256, 100);
        ctx.fillStyle = '#ffaa88';
        ctx.font = '64px "Helvetica Neue", Arial, sans-serif';
        ctx.fillText('FOR YOU', 256, 180);
        const billTex = new THREE.CanvasTexture(canvas);
        billTex.needsUpdate = true;
        const bMat2 = new THREE.MeshStandardMaterial({
            map: billTex,
            emissive: new THREE.Color(0x88ccff),
            emissiveIntensity: 0,
            transparent: true,
            opacity: 0,
            side: THREE.DoubleSide,
            roughness: 0.2,
            metalness: 0.1,
        });
        const billboard2 = new THREE.Mesh(new THREE.PlaneGeometry(3.0, 1.2), bMat2);
        billboard2.position.set(12, 4.5, 8);
        billboard2.rotation.y = -0.5;
        cityGroup.add(billboard2);

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // THE MEMORY ARCHIVE (floating cubes)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const archiveGroup = new THREE.Group();
        archiveGroup.position.set(0, 0, 0);
        archiveGroup.visible = false;
        scene.add(archiveGroup);

        const memoryCubes = [];
        const cubeColors = [0xff6644, 0x44ddff, 0xffdd44, 0x66ff88, 0xff44aa, 0xaa88ff, 0xff8844, 0x44ffcc];

        for (let i = 0; i < 48; i++) {
            const size = 0.2 + Math.random() * 0.4;
            const col = cubeColors[Math.floor(Math.random() * cubeColors.length)];
            const mat = new THREE.MeshStandardMaterial({
                color: col,
                emissive: col,
                emissiveIntensity: 0.1 + Math.random() * 0.2,
                roughness: 0.2,
                metalness: 0.1,
                transparent: true,
                opacity: 0.6 + Math.random() * 0.3,
                envMapIntensity: 0.4,
            });
            const geo = new THREE.BoxGeometry(size, size, size);
            const mesh = new THREE.Mesh(geo, mat);
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.random() * Math.PI;
            const r = 2 + Math.random() * 5;
            mesh.position.set(
                Math.sin(theta) * Math.cos(phi) * r,
                (Math.random() - 0.5) * 4,
                Math.cos(theta) * Math.cos(phi) * r
            );
            mesh.castShadow = true;
            mesh.userData = {
                rotSpeed: (Math.random() - 0.5) * 0.02,
                floatSpeed: 0.3 + Math.random() * 0.4,
                floatAmp: 0.1 + Math.random() * 0.2,
                phase: Math.random() * 100,
                baseY: mesh.position.y,
                originalPos: mesh.position.clone(),
                isWhite: false,
            };
            archiveGroup.add(mesh);
            memoryCubes.push(mesh);
        }

        // The White Cube
        const whiteMat = new THREE.MeshStandardMaterial({
            color: 0xffffff,
            emissive: 0xffffff,
            emissiveIntensity: 0.5,
            roughness: 0.1,
            metalness: 0.3,
            transparent: true,
            opacity: 0.9,
            envMapIntensity: 1.0,
        });
        const whiteCube = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.9, 0.9), whiteMat);
        whiteCube.position.set(0, 0.5, 0);
        whiteCube.castShadow = true;
        whiteCube.userData = { isWhite: true };
        archiveGroup.add(whiteCube);
        memoryCubes.push(whiteCube);

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // THE CHARACTER (final reveal)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const charGroup = new THREE.Group();
        charGroup.position.set(0, -10, 0);
        charGroup.visible = false;
        scene.add(charGroup);

        const charMat = new THREE.MeshStandardMaterial({
            color: 0x88aacc,
            roughness: 0.2,
            metalness: 0.3,
            envMapIntensity: 0.6,
            emissive: 0x446688,
            emissiveIntensity: 0.05,
        });
        const charBody = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.6, 1.4, 12), charMat);
        charBody.position.y = 0.7;
        charBody.castShadow = true;
        charGroup.add(charBody);

        const charHead = new THREE.Mesh(
            new THREE.SphereGeometry(0.32, 12, 12),
            new THREE.MeshStandardMaterial({ color: 0xddbb99, roughness: 0.4, metalness: 0.1 })
        );
        charHead.position.y = 1.6;
        charHead.castShadow = true;
        charGroup.add(charHead);

        // glowing aura
        const auraMat = new THREE.MeshStandardMaterial({
            color: 0x88bbff,
            emissive: 0x4488ff,
            emissiveIntensity: 0.2,
            transparent: true,
            opacity: 0.15,
            side: THREE.BackSide,
        });
        const aura = new THREE.Mesh(new THREE.SphereGeometry(1.2, 16, 16), auraMat);
        aura.position.y = 0.8;
        charGroup.add(aura);

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // AUDIO SYSTEM (Web Audio)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        let audioCtx = null;
        let masterGain = null;
        let musicGain = null;
        let sfxGain = null;
        let osc = null;
        let gainNode = null;
        let musicNodes = [];
        let isAudioReady = false;

        function initAudio() {
            if (audioCtx) return;
            try {
                audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                masterGain = audioCtx.createGain();
                masterGain.gain.value = 0.6;
                masterGain.connect(audioCtx.destination);
                musicGain = audioCtx.createGain();
                musicGain.gain.value = 0.0;
                musicGain.connect(masterGain);
                sfxGain = audioCtx.createGain();
                sfxGain.gain.value = 0.3;
                sfxGain.connect(masterGain);
                isAudioReady = true;
            } catch (e) { console.warn('Audio init failed', e); }
        }

        function playTone(freq, duration, volume, type = 'sine') {
            if (!isAudioReady) return;
            try {
                const osc2 = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                osc2.type = type;
                osc2.frequency.value = freq;
                g.gain.setValueAtTime(volume, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc2.connect(g);
                g.connect(sfxGain);
                osc2.start(audioCtx.currentTime);
                osc2.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        function playAmbientDrone() {
            if (!isAudioReady || musicNodes.length > 0) return;
            try {
                const notes = [55, 62, 69, 77];
                for (let i = 0; i < notes.length; i++) {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.type = 'sine';
                    o.frequency.value = notes[i];
                    g.gain.setValueAtTime(0.01, audioCtx.currentTime);
                    g.gain.linearRampToValueAtTime(0.04, audioCtx.currentTime + 2);
                    o.connect(g);
                    g.connect(musicGain);
                    o.start(audioCtx.currentTime);
                    musicNodes.push({ osc: o, gain: g, base: 0.04 });
                }
            } catch (e) {}
        }

        function stopMusic() {
            for (const n of musicNodes) {
                try {
                    n.gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.8);
                    n.osc.stop(audioCtx.currentTime + 0.9);
                } catch (e) {}
            }
            musicNodes = [];
            if (musicGain) musicGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5);
        }

        function playPianoChord() {
            if (!isAudioReady) return;
            try {
                const notes2 = [261, 329, 392, 523];
                for (let i = 0; i < notes2.length; i++) {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.type = 'sine';
                    o.frequency.value = notes2[i];
                    g.gain.setValueAtTime(0.001, audioCtx.currentTime + i * 0.08);
                    g.gain.linearRampToValueAtTime(0.08, audioCtx.currentTime + i * 0.08 + 0.1);
                    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.08 + 1.8);
                    o.connect(g);
                    g.connect(musicGain);
                    o.start(audioCtx.currentTime + i * 0.08);
                    o.stop(audioCtx.currentTime + i * 0.08 + 2);
                }
            } catch (e) {}
        }

        function playFinalPiano() {
            if (!isAudioReady) return;
            const melody = [262, 294, 330, 349, 392, 440, 494, 523];
            for (let i = 0; i < melody.length; i++) {
                const t = i * 0.15;
                setTimeout(() => {
                    try {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.type = 'sine';
                        o.frequency.value = melody[i] * 0.5;
                        g.gain.setValueAtTime(0.001, audioCtx.currentTime);
                        g.gain.linearRampToValueAtTime(0.06, audioCtx.currentTime + 0.05);
                        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);
                        o.connect(g);
                        g.connect(musicGain);
                        o.start(audioCtx.currentTime);
                        o.stop(audioCtx.currentTime + 0.8);
                    } catch (e) {}
                }, t * 1000);
            }
        }

        function playHeartbeat() {
            if (!isAudioReady) return;
            try {
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.type = 'sine';
                o.frequency.value = 30;
                g.gain.setValueAtTime(0.3, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                o.connect(g);
                g.connect(sfxGain);
                o.start(audioCtx.currentTime);
                o.stop(audioCtx.currentTime + 0.15);
                setTimeout(() => {
                    try {
                        const o2 = audioCtx.createOscillator();
                        const g2 = audioCtx.createGain();
                        o2.type = 'sine';
                        o2.frequency.value = 30;
                        g2.gain.setValueAtTime(0.2, audioCtx.currentTime);
                        g2.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
                        o2.connect(g2);
                        g2.connect(sfxGain);
                        o2.start(audioCtx.currentTime);
                        o2.stop(audioCtx.currentTime + 0.12);
                    } catch (e) {}
                }, 250);
            } catch (e) {}
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // PHASE MANAGEMENT
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        let phase = 0; // 0=boot,1=city,2=strange,3=cityknows,4=signal,5=archive,6=discovery,7=worldbreaks,8=reveal,9=character,10=disappear,11=final,12=surprise
        let phaseTime = 0;
        let worldPaused = false;
        let freezeTimer = 0;
        let cityKnowsTriggered = false;
        let signalTriggered = false;
        let archiveEntered = false;
        let whiteCubeTouched = false;
        let finalRevealShown = false;
        let surpriseShown = false;
        let bootComplete = false;
        let characterAppeared = false;
        let finalMessageShown = false;
        let isTransitioning = false;

        // Camera controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.rotateSpeed = 0.3;
        controls.zoomSpeed = 0.2;
        controls.panSpeed = 0.1;
        controls.maxPolarAngle = Math.PI / 2.1;
        controls.minDistance = 3;
        controls.maxDistance = 45;
        controls.target.set(0, 1, 0);
        controls.enablePan = false;
        controls.autoRotate = false;

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // BOOT SEQUENCE
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const bootMessages = [
            'INITIALIZING WORLD...',
            'GENERATING ENVIRONMENT...',
            'SEARCHING FOR PLAYER...',
            '«Player detected.»',
        ];

        let bootIndex = 0;
        let bootTimer = 0;

        function showBootMessage(idx) {
            if (idx >= bootMessages.length) {
                bootText.textContent = '';
                bootText.classList.remove('show');
                overlay.classList.remove('active');
                bootComplete = true;
                // start city phase
                phase = 1;
                phaseTime = 0;
                controls.target.set(0, 1, 0);
                // subtle sound
                if (isAudioReady) {
                    playTone(120, 0.3, 0.05);
                }
                return;
            }
            bootText.textContent = bootMessages[idx];
            bootText.classList.add('show');
            overlay.classList.add('active');
            // faint click
            if (isAudioReady && idx > 0) {
                playTone(200 + idx * 40, 0.08, 0.02);
            }
            if (idx === 3) {
                // special: player detected
                setTimeout(() => {
                    bootText.textContent = '✦';
                    bootText.style.letterSpacing = '20px';
                    bootText.style.fontSize = 'clamp(20px, 4vw, 40px)';
                    setTimeout(() => {
                        bootText.classList.remove('show');
                        overlay.classList.remove('active');
                        bootComplete = true;
                        phase = 1;
                        phaseTime = 0;
                        controls.target.set(0, 1, 0);
                        if (isAudioReady) {
                            playTone(180, 0.4, 0.06);
                            setTimeout(() => playTone(220, 0.3, 0.04), 200);
                        }
                        // start city ambient drone
                        setTimeout(() => {
                            if (isAudioReady && musicNodes.length === 0) {
                                musicGain.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + 1);
                                playAmbientDrone();
                            }
                        }, 1000);
                    }, 1200);
                }, 800);
                return;
            }
            setTimeout(() => {
                showBootMessage(idx + 1);
            }, 1200 + (idx === 0 ? 400 : 0));
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // INTERACTION
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        let touchStartX = 0,
            touchStartY = 0;
        let isInteracting = false;
        let selectedCube = null;

        renderer.domElement.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                isInteracting = true;
                handleTap(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });

        renderer.domElement.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1 && isInteracting) {
                // handled by OrbitControls
            }
        }, { passive: true });

        renderer.domElement.addEventListener('touchend', () => {
            isInteracting = false;
        }, { passive: true });

        // Mouse for desktop testing
        renderer.domElement.addEventListener('click', (e) => {
            handleTap(e.clientX, e.clientY);
        });

        function handleTap(x, y) {
            if (isTransitioning) return;
            // Raycaster for cube interaction
            const rect = renderer.domElement.getBoundingClientRect();
            const mx = ((x - rect.left) / rect.width) * 2 - 1;
            const my = -((y - rect.top) / rect.height) * 2 + 1;

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(mx, my), camera);

            // Check archive cubes
            if (archiveGroup.visible && phase >= 5 && phase < 7) {
                const intersects = raycaster.intersectObjects(memoryCubes);
                if (intersects.length > 0) {
                    const obj = intersects[0].object;
                    if (obj.userData.isWhite) {
                        // WHITE CUBE TOUCHED!
                        if (!whiteCubeTouched) {
                            whiteCubeTouched = true;
                            triggerDiscovery();
                        }
                        return;
                    } else {
                        // Regular cube - play sound and glow
                        const intensity = 0.3 + Math.random() * 0.5;
                        obj.material.emissiveIntensity = intensity;
                        obj.material.opacity = 0.9;
                        setTimeout(() => {
                            obj.material.emissiveIntensity = 0.1 + Math.random() * 0.2;
                            obj.material.opacity = 0.6 + Math.random() * 0.3;
                        }, 300);
                        if (isAudioReady) {
                            const freq = 200 + Math.random() * 400;
                            playTone(freq, 0.2, 0.03);
                        }
                        // haptic
                        if (navigator.vibrate) navigator.vibrate(10);
                    }
                }
            }

            // Check if we need to trigger signal (phase 4)
            if (phase === 4 && !signalTriggered) {
                // if user looks toward the building at (12, 0, 8)
                const lookDir = new THREE.Vector3();
                camera.getWorldDirection(lookDir);
                const toTarget = new THREE.Vector3(12, 0, 8).sub(camera.position).normalize();
                const dot = lookDir.dot(toTarget);
                if (dot > 0.3) {
                    signalTriggered = true;
                    triggerSignal();
                }
            }
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // PHASE TRIGGERS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        function triggerCityKnows() {
            if (cityKnowsTriggered) return;
            cityKnowsTriggered = true;
            // All screens flash "WELCOME"
            if (isAudioReady) {
                playTone(300, 0.5, 0.05);
                setTimeout(() => playTone(400, 0.3, 0.04), 150);
            }
            // Glow all neon signs
            for (const s of neonSigns) {
                s.mat.emissiveIntensity = 2.0;
                setTimeout(() => {
                    s.mat.emissiveIntensity = 0.6 + Math.random() * 0.8;
                }, 500);
            }
            // Billboard flash
            bMat2.opacity = 1;
            bMat2.emissiveIntensity = 0.8;
            setTimeout(() => {
                bMat2.opacity = 0;
                bMat2.emissiveIntensity = 0;
            }, 1500);
            // Haptic
            if (navigator.vibrate) navigator.vibrate([30, 50, 30]);

            // Move to phase 4 after a moment
            setTimeout(() => {
                phase = 4;
                phaseTime = 0;
                if (isAudioReady) {
                    // radio static sound
                    playTone(80, 0.5, 0.02, 'sawtooth');
                }
                // show hint text
                showHUDText('...صدایی از رادیو...');
            }, 2000);
        }

        let hudTextTimeout = null;

        function showHUDText(text) {
            hud.textContent = text;
            hud.style.color = 'rgba(255,255,255,0.25)';
            hud.style.fontSize = 'clamp(11px, 2vw, 18px)';
            hud.style.letterSpacing = '3px';
            clearTimeout(hudTextTimeout);
            hudTextTimeout = setTimeout(() => {
                hud.style.color = 'rgba(255,255,255,0.06)';
                hud.style.fontSize = '10px';
                hud.style.letterSpacing = '6px';
                hud.textContent = '✦';
            }, 4000);
        }

        function triggerSignal() {
            // Radio voice
            if (isAudioReady) {
                // Simulate voice with tones
                const freqs = [180, 220, 200, 240, 180];
                for (let i = 0; i < freqs.length; i++) {
                    setTimeout(() => {
                        playTone(freqs[i], 0.25, 0.03, 'sawtooth');
                    }, i * 250);
                }
                setTimeout(() => {
                    playTone(160, 0.4, 0.02, 'sawtooth');
                }, 1200);
            }
            if (navigator.vibrate) navigator.vibrate([40, 30, 40]);

            showHUDText('«...can you hear me?»');

            // Open building - move camera toward the special building
            const targetPos = new THREE.Vector3(12, 3, 8);
            const targetLook = new THREE.Vector3(12, 1, 8);
            animateCamera(targetPos, targetLook, 3000);

            setTimeout(() => {
                // Enter archive
                enterArchive();
            }, 3500);
        }

        function enterArchive() {
            phase = 5;
            archiveEntered = true;
            cityGroup.visible = false;
            archiveGroup.visible = true;
            controls.target.set(0, 0.5, 0);
            camera.position.set(3, 2, 5);
            controls.update();
            if (isAudioReady) {
                // mystical sound
                playTone(440, 0.6, 0.04);
                setTimeout(() => playTone(550, 0.4, 0.03), 200);
                setTimeout(() => playTone(660, 0.3, 0.02), 400);
                // ambient drone shift
                if (musicNodes.length > 0) {
                    for (const n of musicNodes) {
                        n.gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                    }
                }
                setTimeout(() => {
                    if (musicGain) musicGain.gain.linearRampToValueAtTime(0.05, audioCtx.currentTime + 0.5);
                }, 300);
            }
            showHUDText('آرشیو خاطرات...');
            if (navigator.vibrate) navigator.vibrate(20);
        }

        function triggerDiscovery() {
            // World pauses
            worldPaused = true;
            phase = 6;
            if (isAudioReady) {
                playHeartbeat();
                // pause sound
                if (musicGain) musicGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
            }
            // Freeze everything - visual effect
            // Flash white
            const flash = document.createElement('div');
            flash.style.cssText =
                'position:fixed;top:0;left:0;width:100%;height:100%;background:white;z-index:15;opacity:0;pointer-events:none;transition:opacity 1.5s ease;';
            document.body.appendChild(flash);
            requestAnimationFrame(() => {
                flash.style.opacity = '0.3';
                setTimeout(() => {
                    flash.style.opacity = '0';
                    setTimeout(() => {
                        flash.remove();
                    }, 1500);
                }, 400);
            });

            showHUDText('WORLD PAUSED');

            // Haptic
            if (navigator.vibrate) navigator.vibrate([50, 30, 50, 30, 80]);

            // After pause, trigger world breaks
            setTimeout(() => {
                triggerWorldBreaks();
            }, 3000);
        }

        function triggerWorldBreaks() {
            phase = 7;
            // Camera zooms out dramatically
            const startPos = camera.position.clone();
            const endPos = new THREE.Vector3(0, 35, 60);
            const startTarget = controls.target.clone();
            const endTarget = new THREE.Vector3(0, 0, 0);

            let t = 0;
            const duration = 4000;
            const startTime = performance.now();

            function zoomOut() {
                const elapsed = performance.now() - startTime;
                t = Math.min(elapsed / duration, 1);
                const ease = 1 - Math.pow(1 - t, 3);
                camera.position.lerpVectors(startPos, endPos, ease);
                controls.target.lerpVectors(startTarget, endTarget, ease);
                controls.update();
                if (t < 1) {
                    requestAnimationFrame(zoomOut);
                } else {
                    // Show "FOR YOU" in the stars
                    phase = 8;
                    showReveal();
                }
            }
            zoomOut();

            if (isAudioReady) {
                // swelling sound
                const swell = () => {
                    try {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.type = 'sine';
                        o.frequency.value = 120;
                        g.gain.setValueAtTime(0.001, audioCtx.currentTime);
                        g.gain.linearRampToValueAtTime(0.08, audioCtx.currentTime + 2);
                        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 4);
                        o.connect(g);
                        g.connect(musicGain);
                        o.start(audioCtx.currentTime);
                        o.stop(audioCtx.currentTime + 4);
                    } catch (e) {}
                };
                swell();
                setTimeout(swell, 500);
            }
            if (navigator.vibrate) navigator.vibrate([30, 20, 30]);
        }

        function showReveal() {
            // Show "FOR YOU" text overlay
            const revealDiv = document.createElement('div');
            revealDiv.style.cssText = `
            position:fixed;top:0;left:0;width:100%;height:100%;
            display:flex;justify-content:center;align-items:center;
            z-index:18;pointer-events:none;
            color:white;font-size:clamp(40px,10vw,90px);
            font-weight:200;letter-spacing:20px;
            text-shadow:0 0 100px rgba(255,200,200,0.15);
            background:rgba(0,0,0,0.2);
            opacity:0;transition:opacity 2.5s ease;
            font-family:'Helvetica Neue',Arial,sans-serif;
          `;
            revealDiv.textContent = 'FOR YOU';
            document.body.appendChild(revealDiv);
            requestAnimationFrame(() => {
                revealDiv.style.opacity = '1';
            });

            if (isAudioReady) {
                playPianoChord();
                setTimeout(() => playPianoChord(), 1000);
                // music swell
                if (musicGain) musicGain.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + 0.5);
            }
            if (navigator.vibrate) navigator.vibrate(40);

            setTimeout(() => {
                revealDiv.style.opacity = '0';
                setTimeout(() => {
                    revealDiv.remove();
                    // Show character
                    showCharacter();
                }, 1500);
            }, 3500);
        }

        function showCharacter() {
            phase = 9;
            characterAppeared = true;
            charGroup.visible = true;
            charGroup.position.set(0, 0, -2);

            // Move camera to face character
            const targetPos = new THREE.Vector3(0, 0.8, 3.5);
            const targetLook = new THREE.Vector3(0, 0.8, -1);
            animateCamera(targetPos, targetLook, 2000);

            if (isAudioReady) {
                // soft chord
                setTimeout(() => {
                    const notes3 = [262, 330, 392];
                    for (let i = 0; i < notes3.length; i++) {
                        setTimeout(() => {
                            try {
                                const o = audioCtx.createOscillator();
                                const g = audioCtx.createGain();
                                o.type = 'sine';
                                o.frequency.value = notes3[i];
                                g.gain.setValueAtTime(0.001, audioCtx.currentTime);
                                g.gain.linearRampToValueAtTime(0.05, audioCtx.currentTime + 0.05);
                                g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);
                                o.connect(g);
                                g.connect(musicGain);
                                o.start(audioCtx.currentTime);
                                o.stop(audioCtx.currentTime + 1.5);
                            } catch (e) {}
                        }, i * 200);
                    }
                }, 500);
            }

            // Show dialogue
            setTimeout(() => {
                showDialogue('می‌دونی چرا این دنیا اینجاست؟');
            }, 1500);
            setTimeout(() => {
                showDialogue('چون می‌خواستم یه جایی داشته باشم که بتونم چیزی رو بهت بگم...');
            }, 4000);

            setTimeout(() => {
                triggerDisappear();
            }, 7000);
        }

        let dialogueTimeout = null;

        function showDialogue(text) {
            const el = document.createElement('div');
            el.style.cssText = `
            position:fixed;bottom:15%;left:50%;transform:translateX(-50%);
            z-index:16;color:rgba(255,255,255,0.7);
            font-size:clamp(14px,3.2vw,26px);
            font-weight:200;letter-spacing:2px;
            text-align:center;max-width:80%;
            text-shadow:0 0 40px rgba(0,0,0,0.8);
            background:rgba(0,0,0,0.3);padding:16px 32px;
            border-radius:8px;backdrop-filter:blur(8px);
            border:1px solid rgba(255,255,255,0.04);
            opacity:0;transition:opacity 1.2s ease;
            font-family:'Helvetica Neue',Arial,sans-serif;
            pointer-events:none;
          `;
            el.textContent = text;
            document.body.appendChild(el);
            requestAnimationFrame(() => {
                el.style.opacity = '1';
            });
            clearTimeout(dialogueTimeout);
            dialogueTimeout = setTimeout(() => {
                el.style.opacity = '0';
                setTimeout(() => el.remove(), 1200);
            }, 2800);
            if (navigator.vibrate) navigator.vibrate(15);
        }

        function triggerDisappear() {
            phase = 10;
            // Everything disappears
            if (isAudioReady) {
                if (musicGain) musicGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5);
                playTone(100, 0.8, 0.04);
            }

            // Fade to black
            const fade = document.createElement('div');
            fade.style.cssText =
                'position:fixed;top:0;left:0;width:100%;height:100%;background:black;z-index:19;opacity:0;pointer-events:none;transition:opacity 2.5s ease;';
            document.body.appendChild(fade);
            requestAnimationFrame(() => {
                fade.style.opacity = '1';
            });

            // Hide everything
            setTimeout(() => {
                cityGroup.visible = false;
                archiveGroup.visible = false;
                charGroup.visible = false;
                rainSystem.visible = false;
                // Hide NPCs and cars
                for (const c of cars) { c.body.visible = false;
                    c.cab.visible = false;
                    c.hl.visible = false; }
                for (const n of npcs) { n.group.visible = false; }
                // Keep only black
                scene.background = new THREE.Color(0x000000);
                scene.fog = new THREE.FogExp2(0x000000, 0);
            }, 2000);

            setTimeout(() => {
                fade.remove();
                showFinalMessage();
            }, 3500);
        }

        function showFinalMessage() {
            phase = 11;
            finalMessageShown = true;
            msgLayer.classList.add('show');
            finalMsg.innerHTML = `
            من شاید نتونم همیشه احساسمو درست بیان کنم...<br><br>
            ولی یه چیزو مطمئنم.<br><br>
            <span class="highlight">از وقتی وارد زندگیم شدی...</span><br><br>
            یه چیزی توی من عوض شد.<br><br><br>
            <span style="font-size:clamp(28px,6vw,56px);letter-spacing:4px;color:#ff9a9e;text-shadow:0 0 80px rgba(255,150,150,0.2);">
              دوستت دارم. ❤️
            </span>
          `;

            if (isAudioReady) {
                playFinalPiano();
                if (musicGain) musicGain.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + 0.3);
            }
            if (navigator.vibrate) navigator.vibrate([50, 30, 50]);

            // Show reveal button after a moment
            setTimeout(() => {
                revealBtn.style.display = 'block';
                revealBtn.style.opacity = '1';
            }, 4000);
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // REVEAL BUTTON
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        revealBtn.addEventListener('click', () => {
            if (surpriseShown) return;
            surpriseShown = true;
            phase = 12;
            msgLayer.classList.remove('show');
            // Show final reveal
            finalReveal.classList.add('show');
            if (isAudioReady) {
                playPianoChord();
                setTimeout(() => playPianoChord(), 600);
                if (musicGain) musicGain.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + 0.3);
            }
            if (navigator.vibrate) navigator.vibrate([40, 20, 40, 20, 60]);

            // Also show the big "YOU ARE SPECIAL" in 3D space as a final touch
            // We'll just keep the overlay
            setTimeout(() => {
                // subtle animation on the text
                const big = finalReveal.querySelector('.big');
                if (big) {
                    big.style.transition = 'transform 3s ease, text-shadow 3s ease';
                    big.style.transform = 'scale(1.04)';
                    big.style.textShadow = '0 0 120px rgba(255,200,200,0.2)';
                }
            }, 500);
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // CAMERA ANIMATION HELPER
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function animateCamera(targetPos, targetLook, duration) {
            const startPos = camera.position.clone();
            const startTarget = controls.target.clone();
            const startTime = performance.now();

            function step() {
                const elapsed = performance.now() - startTime;
                const t = Math.min(elapsed / duration, 1);
                const ease = 1 - Math.pow(1 - t, 3);
                camera.position.lerpVectors(startPos, targetPos, ease);
                controls.target.lerpVectors(startTarget, targetLook, ease);
                controls.update();
                if (t < 1) {
                    requestAnimationFrame(step);
                }
            }
            step();
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // RESIZE
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
            composer.setSize(w, h);
            fxaaPass.uniforms['resolution'].value.set(1 / w, 1 / h);
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // GAME LOOP
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        let clock = new THREE.Clock();
        let elapsedTime = 0;

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            elapsedTime += delta;
            phaseTime += delta;

            // ── Rain ──
            if (rainSystem.visible) {
                const pos = rainSystem.geometry.attributes.position.array;
                for (let i = 0; i < rainCount; i++) {
                    pos[i * 3 + 1] -= delta * (8 + rainVel[i] * 0.5);
                    pos[i * 3] += delta * (Math.sin(elapsedTime + i) * 0.3);
                    pos[i * 3 + 2] += delta * (Math.cos(elapsedTime + i * 0.7) * 0.3);
                    if (pos[i * 3 + 1] < -2) {
                        pos[i * 3 + 1] = 25 + Math.random() * 5;
                        pos[i * 3] = (Math.random() - 0.5) * rainArea;
                        pos[i * 3 + 2] = (Math.random() - 0.5) * rainArea;
                    }
                }
                rainSystem.geometry.attributes.position.needsUpdate = true;
            }

            // ── Neon flicker ──
            for (const s of neonSigns) {
                const val = 0.5 + 0.5 * Math.sin(elapsedTime * s.speed + s.phase);
                s.mat.emissiveIntensity = 0.3 + val * 0.8;
            }

            // ── Memory cubes float ──
            if (archiveGroup.visible) {
                for (const cube of memoryCubes) {
                    const data = cube.userData;
                    cube.rotation.x += data.rotSpeed || 0.005;
                    cube.rotation.y += (data.rotSpeed || 0.005) * 0.7;
                    if (data.floatAmp) {
                        const yOff = Math.sin(elapsedTime * data.floatSpeed + data.phase) * data.floatAmp;
                        cube.position.y = data.baseY + yOff;
                    }
                    if (!data.isWhite) {
                        const glow = 0.1 + 0.2 * (0.5 + 0.5 * Math.sin(elapsedTime * 0.5 + data.phase));
                        cube.material.emissiveIntensity = glow;
                    }
                }
                // White cube pulses
                whiteMat.emissiveIntensity = 0.3 + 0.4 * (0.5 + 0.5 * Math.sin(elapsedTime * 1.2));
                whiteMat.opacity = 0.7 + 0.3 * (0.5 + 0.5 * Math.sin(elapsedTime * 0.8));
            }

            // ── Cars move ──
            if (!worldPaused && cityGroup.visible) {
                for (const car of cars) {
                    if (!car.active) continue;
                    car.x += Math.sin(car.angle) * delta * car.speed * 1.2;
                    car.z += Math.cos(car.angle) * delta * car.speed * 1.2;
                    // boundary
                    const bound = 26;
                    if (Math.abs(car.x) > bound || Math.abs(car.z) > bound) {
                        car.angle += Math.PI * (0.5 + Math.random() * 0.5);
                        car.x = Math.max(-bound, Math.min(bound, car.x));
                        car.z = Math.max(-bound, Math.min(bound, car.z));
                    }
                    car.body.position.set(car.x, 0.2, car.z);
                    car.body.rotation.y = car.angle;
                    car.cab.position.set(car.x + Math.sin(car.angle) * 0.2, 0.4, car.z + Math.cos(car.angle) * 0.2);
                    car.cab.rotation.y = car.angle;
                    car.hl.position.set(car.x + Math.sin(car.angle) * 0.55, 0.2, car.z + Math.cos(car.angle) * 0.55);
                }
            }

            // ── NPCs move ──
            if (!worldPaused && cityGroup.visible) {
                for (const npc of npcs) {
                    npc.timer += delta;
                    if (npc.timer > 3 + Math.random() * 4) {
                        npc.timer = 0;
                        const angle = Math.random() * Math.PI * 2;
                        const dist = 1 + Math.random() * 3;
                        npc.targetX = npc.x + Math.sin(angle) * dist;
                        npc.targetZ = npc.z + Math.cos(angle) * dist;
                        const bound2 = 26;
                        npc.targetX = Math.max(-bound2, Math.min(bound2, npc.targetX));
                        npc.targetZ = Math.max(-bound2, Math.min(bound2, npc.targetZ));
                        npc.dir = angle;
                    }
                    const dx = npc.targetX - npc.x;
                    const dz = npc.targetZ - npc.z;
                    const dist2 = Math.sqrt(dx * dx + dz * dz);
                    if (dist2 > 0.1) {
                        const speed2 = npc.speed * delta * 0.8;
                        npc.x += (dx / dist2) * speed2;
                        npc.z += (dz / dist2) * speed2;
                        npc.group.position.set(npc.x, 0, npc.z);
                        npc.group.rotation.y = Math.atan2(dx, dz);
                    }
                    // subtle bob
                    const bob = Math.sin(elapsedTime * 1.5 + npc.phase) * 0.005;
                    npc.group.position.y = bob;
                }
            }

            // ── Auto rotate in city phase ──
            if (phase === 1 && bootComplete && !isTransitioning) {
                controls.autoRotate = true;
                controls.autoRotateSpeed = 0.15;
            } else {
                controls.autoRotate = false;
            }

            // ── Phase 2: Strange events ──
            if (phase === 1 && phaseTime > 8 && !cityKnowsTriggered) {
                // Trigger strange events
                phase = 2;
                // Make some NPCs look at camera
                for (let i = 0; i < Math.min(3, npcs.length); i++) {
                    const idx = Math.floor(Math.random() * npcs.length);
                    const npc = npcs[idx];
                    if (npc) {
                        const dir = new THREE.Vector3(
                            camera.position.x - npc.x,
                            0,
                            camera.position.z - npc.z
                        ).normalize();
                        npc.group.rotation.y = Math.atan2(dir.x, dir.z);
                        // turn back after a moment
                        setTimeout(() => {
                            npc.group.rotation.y = npc.dir;
                        }, 1500 + Math.random() * 500);
                    }
                }
                // Billboard flash
                bMat2.opacity = 1;
                bMat2.emissiveIntensity = 0.8;
                setTimeout(() => {
                    bMat2.opacity = 0;
                    bMat2.emissiveIntensity = 0;
                }, 1200);
                if (isAudioReady) {
                    playTone(500, 0.1, 0.02);
                    setTimeout(() => playTone(400, 0.1, 0.02), 150);
                }
                showHUDText('...عجیب...');

                setTimeout(() => {
                    phase = 3;
                    triggerCityKnows();
                }, 4000);
            }

            // ── Phase 4: Signal - auto trigger after some time if not triggered ──
            if (phase === 4 && !signalTriggered && phaseTime > 10) {
                signalTriggered = true;
                triggerSignal();
            }

            // ── Controls update ──
            controls.update();

            // ── Render ──
            composer.render();
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // START
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // Initialize audio on first touch
        document.addEventListener('touchstart', () => {
            if (!isAudioReady) {
                initAudio();
                // start boot after audio init
                if (!bootComplete) {
                    setTimeout(() => {
                        showBootMessage(0);
                    }, 300);
                }
            }
        }, { once: true });

        // Also try on load
        setTimeout(() => {
            initAudio();
            if (!bootComplete) {
                showBootMessage(0);
            }
        }, 500);

        // Hide loading
        setTimeout(() => {
            loading.classList.add('hide');
            setTimeout(() => loading.style.display = 'none', 1200);
        }, 800);

        // Start loop
        animate();

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // HAPTIC FEEDBACK ON KEY MOMENTS (global)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // We already trigger haptics in specific moments

        console.log('✦ THE WORLD I MADE FOR YOU ✦');
        console.log('A cinematic experience by AI');

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // FALLBACK: If user doesn't touch, start anyway
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        setTimeout(() => {
            if (!bootComplete) {
                initAudio();
                showBootMessage(0);
            }
        }, 2000);

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // KEYBOARD SHORTCUTS (desktop debug)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        document.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') {
                // reset view
                camera.position.set(18, 12, 28);
                controls.target.set(0, 1, 0);
                controls.update();
            }
            if (e.key === 'f' || e.key === 'F') {
                // force final
                if (!finalMessageShown) {
                    triggerDisappear();
                }
            }
        });

        console.log('✦ Controls: drag to look around, tap to interact ✦');
        console.log('✦ Keyboard: R=reset view, F=force finale ✦');
    </script>
</body>
</html>
